<hr />
<h2>List Notes</h2>
<button (click)="refresh()">Refresh</button>
<table>
    <thead>
        <th>
            Title
        </th>
        <th>
            Description
        </th>
    </thead>
    <tbody>
        @for(note of notes; track note) {
            <tr>
                <td>
                    {{note.title}}
                </td>
                <td>
                    {{note.description}}
                </td>
            </tr>
        }
    </tbody>
</table>
